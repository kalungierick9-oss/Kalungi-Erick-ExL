<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Place your food order at The Golden Queen restaurant."><title>The Golden Queen | Order Form</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body>
<header class="site-header"><div class="header-top"><a class="brand" href="index.html">The Golden Queen</a><div class="logo" role="img" aria-label="The Golden Queen crown logo">♛</div></div><nav class="main-nav" aria-label="Main navigation"><a href="index.html">Menu</a><a class="active" href="form.html">Form</a></nav></header>
<main class="container form-container"><section class="intro"><p class="eyebrow">YOUR TABLE, YOUR CHOICE</p><h1>Order Form</h1><p>Please fill in the details below to place your order.</p></section>
<form id="orderForm" class="order-form"><div class="form-group"><label for="customerName">Name</label><input type="text" id="customerName" name="customerName" maxlength="50" required placeholder="Enter your full name"><small>Maximum 50 characters.</small></div>
<fieldset class="form-group"><legend>Gender</legend><div class="choice-row"><label class="choice"><input type="radio" name="gender" value="Male" required> Male</label><label class="choice"><input type="radio" name="gender" value="Female"> Female</label><label class="choice"><input type="radio" name="gender" value="Other"> Other</label></div></fieldset>
<div class="form-group"><label for="meal">Chosen meal</label><select id="meal" name="meal" required><option value="">Select a meal</option><option>Chicken Salad</option><option>Queen's Pizza</option><option>Beef Burger</option><option>Cheese Pizza</option></select></div>
<div class="form-group"><label for="tableNumber">Table number</label><input type="number" id="tableNumber" name="tableNumber" min="1" max="12" step="1" required placeholder="Choose table 1–12"></div>
<fieldset class="form-group"><legend>Drinks</legend><div class="choice-row"><label class="choice"><input type="checkbox" name="drinks" value="Wine"> Wine</label><label class="choice"><input type="checkbox" name="drinks" value="Beer"> Beer</label><label class="choice"><input type="checkbox" name="drinks" value="Soda"> Soda</label><label class="choice"><input type="checkbox" name="drinks" value="Water"> Water</label></div></fieldset>
<button class="submit-button" type="submit">Submit Order</button><p id="formMessage" class="form-message" role="status" aria-live="polite"></p></form></main>
<footer class="site-footer"><p>&copy; 2026 The Golden Queen. All rights reserved.</p><p>Website developer: <strong>Kalungi Erick</strong></p></footer></body></html>
